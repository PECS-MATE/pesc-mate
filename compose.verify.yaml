# Independent validation stack: never merge with the development/production files.
services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--quiet"]
    tmpfs:
      - /data/db
      - /data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging:
      driver: none
    networks: [validation]

  backend:
    image: pesc-mate-verify-backend:${PESC_VERIFY_RUN:?Use the validation runner}
    build:
      context: ./backend
      dockerfile: Dockerfile.verify
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: pesc_mate_verification
      OLLAMA_ENABLED: "false"
      # Only the isolated internal test network; public dev stack remains HTTPS-only by default.
      RFID_ALLOW_INSECURE_LAN: "true"
      DEMO_ACCOUNTS_ENABLED: "true"
      DEMO_USERNAME: demo
      DEMO_PASSWORD: demo1234
      CAREGIVER_USERNAME: caregiver
      CAREGIVER_PASSWORD: caregiver1234
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      ACCOUNT_PERMISSION_MANAGER_IDS: ""
      IMAGE_SAFETY_API_URL: ""
      IMAGE_SAFETY_API_TOKEN: ""
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [validation]

  frontend:
    image: pesc-mate-verify-frontend:${PESC_VERIFY_RUN:?Use the validation runner}
    build:
      context: ./frontend
      dockerfile: Dockerfile.verify
      target: check
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30
    networks: [validation]

  browser:
    image: pesc-mate-verify-browser:${PESC_VERIFY_RUN:?Use the validation runner}
    build:
      context: ./frontend
      dockerfile: Dockerfile.verify
      target: browser
    environment:
      CI: ""
      E2E_START_SERVERS: "false"
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_BASE_URL: http://127.0.0.1:5173
      PLAYWRIGHT_BROWSER_PATH: ""
    shm_size: 1gb
    volumes:
      - type: bind
        source: ${PESC_VERIFY_BROWSER_RESULTS:?Use the validation runner}
        target: /app/test-results
    # Same private loopback as Vite: keep host checks and browser secure-context rules intact.
    network_mode: service:frontend

networks:
  validation:
    internal: true
