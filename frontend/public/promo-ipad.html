<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PECS MATE · 아이패드 시연</title>
  <link rel="stylesheet" href="/promo/promo-ipad.css">
</head>
<body>
  <main class="stage" aria-label="아이패드 프레임의 PECS MATE 자동 시연">
    <div class="tablet"><iframe src="/?promo=demo" title="PECS MATE 자동 시연 애니메이션" allow="autoplay; fullscreen; microphone"></iframe></div>
  </main>
  <nav class="toolbar" aria-label="촬영 설정">
    <strong>PECS MATE</strong>
    <button id="play" type="button">일시정지</button>
    <button id="restart" type="button">처음부터</button>
    <button id="next" type="button">다음 장면</button>
    <button id="mode" type="button">실제 앱 조작</button>
    <button id="background" type="button" aria-pressed="false">흰 배경</button>
    <button id="fullscreen" type="button">전체 화면</button>
    <button id="recording" type="button">촬영 모드</button>
  </nav>
  <button class="restore" type="button" aria-label="촬영 설정 다시 표시">촬영 설정 표시</button>
  <p class="status" role="status"></p>
  <script src="/promo/promo-ipad.js"></script>
</body>
</html>
