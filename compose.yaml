name: pesc-mate

services:
  mongodb:
    image: mongo:8.0
    command: ["mongod", "--quiet"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 3s
      retries: 10
    logging:
      driver: "none"

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --no-access-log
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: pesc_mate
      DEMO_USERNAME: demo
      DEMO_PASSWORD: demo1234
      CAREGIVER_USERNAME: caregiver
      CAREGIVER_PASSWORD: caregiver1234
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "500"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_TIMEOUT_SECONDS: "60"
      IMAGE_SAFETY_API_URL: "${IMAGE_SAFETY_API_URL:-}"
      IMAGE_SAFETY_API_TOKEN: "${IMAGE_SAFETY_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
  frontend_node_modules:
