name: pesc-mate

services:
  melotts:
    build:
      context: ./services/melotts
    environment:
      MELO_THREADS: "2"
    volumes:
      - melotts_models:/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 10m
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mongodb:
    image: mongo:8.0
    attach: false
    command: ["mongod", "--quiet"]
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 3s
      retries: 10
    logging:
      driver: "none"

  backend:
    build:
      context: ./backend
      args:
        INSTALL_IMAGE_TOOLS: "${INSTALL_IMAGE_TOOLS:-false}"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app --no-access-log
    environment:
      MONGODB_URI: mongodb://mongodb:27017
      MELO_TTS_URL: http://melotts:8090
      TTS_CACHE_VERSION: "${TTS_CACHE_VERSION:-melotts-kr-v1}"
      MONGODB_DATABASE: pesc_mate
      DEMO_ACCOUNTS_ENABLED: "true"
      ACCOUNT_PERMISSION_MANAGER_IDS: "${ACCOUNT_PERMISSION_MANAGER_IDS:-}"
      DEMO_USERNAME: demo
      DEMO_PASSWORD: demo1234
      CAREGIVER_USERNAME: caregiver
      CAREGIVER_PASSWORD: caregiver1234
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin1234
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "500"
      OLLAMA_ENABLED: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:0.5b
      OLLAMA_TIMEOUT_SECONDS: "10"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-30m}"
      OLLAMA_WARMUP_ENABLED: "${OLLAMA_WARMUP_ENABLED:-true}"
      OLLAMA_WARMUP_TIMEOUT_SECONDS: "${OLLAMA_WARMUP_TIMEOUT_SECONDS:-30}"
      OLLAMA_NUM_CTX: "${OLLAMA_NUM_CTX:-2048}"
      OLLAMA_NUM_PREDICT: "${OLLAMA_NUM_PREDICT:-60}"
      OLLAMA_LEARNING_ENABLED: "${OLLAMA_LEARNING_ENABLED:-false}"
      OLLAMA_LEARNING_MODEL: "${OLLAMA_LEARNING_MODEL:-qwen3:4b-instruct}"
      IMAGE_SAFETY_API_URL: "${IMAGE_SAFETY_API_URL:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      IMAGE_GENERATION_PROVIDER: "${IMAGE_GENERATION_PROVIDER:-huggingface}"
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_IMAGE_MODEL: "${HF_IMAGE_MODEL:-black-forest-labs/FLUX.1-schnell}"
      HF_IMAGE_PROVIDER: "${HF_IMAGE_PROVIDER:-fal-ai}"
      GEMINI_IMAGE_MODEL: "${GEMINI_IMAGE_MODEL:-}"
      REMBG_MODEL_PATH: "${REMBG_MODEL_PATH:-}"
      IMAGE_SAFETY_API_TOKEN: "${IMAGE_SAFETY_API_TOKEN:-}"
      IMAGE_USER_LIMIT_MIB: "${IMAGE_USER_LIMIT_MIB:-200}"
      IMAGE_TOTAL_LIMIT_MIB: "${IMAGE_TOTAL_LIMIT_MIB:-2048}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      melotts:
        condition: service_started
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    command: sh ./start-dev.sh
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  melotts_models:
  mongodb_data:
  frontend_node_modules:
